schema: 1
tracker:
    kind: github
    endpoint: https://api.github.com/graphql
    api_key: $GITHUB_TOKEN
    github_status_source: label
    repository: digitaldrywood/detent
    status_label_prefix: "detent:"
    observed_states:
        - Backlog
        - Blocked
        - Human Review
    active_states:
        - Todo
        - In Progress
        - Rework
        - Merging
    terminal_states:
        - Done
        - Cancelled
    state_map:
        Cancelled: Done
    dependency_auto_unblock:
        enabled: true
        source_states:
            - Blocked
        target_state: Todo
        readiness: terminal_or_merged
# Scheduled admission pass (detent#1535). A read-only agent scores Backlog
# issues against the "Admission Criteria" section of WORKFLOW.md and PROPOSES
# the ones worth dispatching. It never changes issue status — a human accepts
# each proposal, which is what then moves the issue to Todo. Dogfooding this
# is the point: the standing operator step it removes is the manual "look at
# everything in Backlog and decide what's legit" sweep.
#
# sources.states is Backlog-only on purpose: .github/workflows/issue-intake.yml
# auto-applies detent:backlog to any issue opened without a detent status
# label, so this repo has no untracked/unlabeled issues to sweep and does not
# need sources.untracked (#1553, still queued — that one is for boards like
# digitaldrywood that carry unlabeled issues).
backlog_admission:
    enabled: true
    # Every 15 minutes (operator decision, 2026-07-30). A once-daily pass was
    # tried and is wrong for this board: a bug filed at 13:30 would wait until
    # 06:00 the next weekday, which defeats the point of admission — work
    # should reach Todo without a human noticing it first.
    #
    # The cadence is cheap. Measured over 20 runs: ~25s wall clock and ~36k
    # tokens per run. At 15m that is ~96 runs/day, ~3.5M tokens/day — about a
    # quarter of ONE implementation session on this host (max_session_tokens
    # is 200M). Runs that find no candidates cost less than that average.
    #
    # Bounded by max_proposals_per_run/max_open_proposals below, so this
    # cadence cannot flood the board.
    schedule: '*/15 * * * *'
    # Accepting a proposal now performs the admission (detent#1558 -> PR #1560).
    # auto_admit removes the human accept step entirely for high-confidence
    # proposals, which is the point of the feature: turn the manual "read
    # Backlog, decide what is legit, promote it" sweep into something the system
    # does. Admitted issues move to target_state and become dispatchable
    # immediately. min_confidence defaults to 0.9; set explicitly so the bar is
    # visible in config review rather than implied.
    auto_admit: true
    # Lowered 0.9 -> 0.85 (2026-07-31). Both sub-0.9 proposals to date (#1527
    # at 0.86, #1586 at 0.88) were ultimately accepted by the operator by hand,
    # and zero sub-0.9 proposals have been rejected — the 0.9 bar was calibrated
    # stricter than the operator's own judgment and produced silent waits.
    auto_admit_min_confidence: 0.85
    sources:
        states:
            - Backlog
    target_state: Todo
    criteria_section: Admission Criteria
    authors:
        # Only propose issues filed by known operators, so a drive-by external
        # issue cannot enter the dispatch queue via admission.
        allow:
            - corylanou
            - loganlanou
            - michaelhvisser
            - jarvislanou
    max_candidates_per_run: 50
    max_proposals_per_run: 3
    max_open_proposals: 10
    proposal_expiry_days: 7
polling:
    # Label-backed status polling uses REST issue/label endpoints. A 2-min
    # cadence keeps the board responsive while leaving GraphQL budget for
    # operations that have no REST equivalent.
    interval_ms: 120000
server:
    # Tailnet-only bind (2026-08-08). This repository is public and this
    # dashboard runs kanban.mode: integration, so it is a control plane that
    # mutates GitHub on the operator's behalf; 0.0.0.0 published the exact bind
    # of that control plane and exposed it to the whole LAN.
    #
    # Deliberately NOT 127.0.0.1. web/auth.go grants a full StaticCredential to
    # any API caller when the server address is loopback and api_token is unset,
    # which is the case here — a loopback bind would turn /api/v1 from
    # fail-closed (403) into unauthenticated full access for every process on
    # this host. A tailnet address keeps the API failing closed.
    #
    # This is corys-mac-studio's stable Tailscale IPv4. Reach the dashboard at
    # http://corys-mac-studio.tail60aac7.ts.net:4000 (MagicDNS) from any device
    # on the tailnet. Note that detent must be started after tailscaled is up,
    # or the bind fails.
    host: 100.95.107.50
    port: 4000
    kanban:
        mode: integration
workspace:
    root: ~/code/detent-workspaces
    source_root: ~/projects/digitaldrywood/detent
agent:
    # Merge train: keep global throughput at 5, but serialize the final
    # rebase/push/merge so concurrent merge candidates do not invalidate
    # each other's CI. States omitted from max_concurrent_agents_by_state
    # share the global pool.
    # Restored to 5 (full throughput): the two root causes of the earlier
    # exhaustion are fixed — host TCP/socket churn (sysctl msl=1000 +
    # portrange.first=16384 + #311 process-group reaping) and the 552-pt board
    # poll (#313/#314 gutted it to single-digit points; budget holds at ~5000).
    # Raised to 10 (2026-08-08, operator goal: run as many sessions at once as
    # this host can take). Supersedes the temporary 5->7->9 props used on
    # 2026-08-07/08 to clear a provider-rate-window wedge; those are resolved —
    # the wedge cause was fixed by the two-stage merge admission change (#1659)
    # and the Codex window has since reset.
    #
    # dispatch_planner.go:653-661 scales THIS value by the Codex window remaining
    # percent: ceil(10 * remaining/100), floored at 1. At the current 92% that is
    # a scaled cap of 10, so the scaling is not currently the binding constraint.
    # It bites as the window drains: 10 gives 9 at 85%, 5 at 45%, 2 at 15%.
    #
    # Raising this alone would NOT have produced 10 sessions — global.yaml's
    # global.max_concurrent_agents is the fleet hard ceiling (a separate pool,
    # enforced at dispatch.go:315) and was raised 5 -> 10 alongside this.
    #
    # Codex window is WEEKLY (reset 2026-08-15T14:34:48Z). Burn is ~0.8%/hr per
    # agent (measured ~3.3%/hr at 4 agents), so 10 agents flat out is ~8%/hr.
    #
    # That is NOT a problem for this host's actual usage, which is spiky rather
    # than sustained: bursts to catch up, long stretches near idle. The window
    # read 92% after a full week away, which is the pattern in one number. A
    # 4h catch-up burst at 10 agents costs ~32% and still leaves ~56% for the
    # rest of the week; even 8h flat out leaves ~24%.
    #
    # Sizing this for the average would waste the burst capacity that is the
    # whole point. The throttle is also self-correcting, not a cliff: as the
    # window drains, dispatch_planner.go scales the cap down gradually and
    # surfaces provider_rate_window_backpressure. Only revisit this value if
    # sustained (not spiky) churn becomes the norm.
    max_concurrent_agents: 10
    # Spend-progress breaker DISABLED 2026-07-12 (0 = off, spend_progress.go
    # gates on limit <= 0): this host runs on a flat Codex subscription, so
    # every USD figure the breaker computes is notional — it was parking
    # healthy merge-train-tail work over fake dollars (detent#1276) and
    # crippled fleet throughput. Real runaway brakes stay on: no-progress
    # diff-fingerprint parking (#1232), max_session_tokens, and provider
    # capacity pauses (#1158). Re-enable only with an auth-aware design
    # (subscription vs metered — see the subscription-mode issue).
    no_progress_spend_limit_usd: 0
    max_concurrent_agents_by_state:
        Merging: 1
    dispatch_priority_by_state:
        - Merging
        - Rework
        - In Progress
        - Todo
    # hotfix label jumps the queue within a state — used to cut hotfix releases.
    # priority marks backlog items that should dispatch ahead of unlabeled work
    # once promoted to Todo.
    dispatch_priority_by_label:
        - hotfix
        - priority
        - bug
    max_turns: 20
    # Trial: reattach orphaned provider threads on restart (detent#1155/PR #1175)
    # instead of fresh continuations — falls back safely if resume fails.
    resume_orphaned_sessions: true
    experimental_thread_resume: true
    # Kill runaway sessions at 4x the observed median (7.7M tokens); the worst
    # outlier hit 55M while p90 is 23M, so this cap only cuts the pathological
    # tail (doctor runaway_session_tokens finding).
    # Wall-clock runaway brakes, enabled 2026-07-29. These are the controls
    # added for detent#1496/#1508 after a single turn ran 8.9h (another 16.5h)
    # and was stopped only by max_session_tokens. Note that codex.turn_timeout_ms
    # is NOT a substitute: it bounds the gap between two stream messages, so a
    # chatty-but-unproductive agent never trips it at any value.
    #
    # Sized from this host's own history (1352 recorded sessions, 784 successful
    # agent attempts): p50 13.5m, p90 45.8m, p99 93.2m, longest success 159.8m.
    # Only 2 of 784 successes exceeded 120m. A 240m turn cap therefore would
    # have killed ZERO successful attempts while cutting the 8.9h/16.5h
    # pathological tail by more than half.
    #
    # Every session on this backend is currently a single turn (max_turns=1
    # across all 1352 rows), so the turn cap is the brake that actually fires.
    # The session cap sits above it as a backstop that still binds if the
    # backend ever produces genuinely multi-turn sessions.
    max_turn_duration_ms: 14400000
    max_session_duration_ms: 18000000
    max_session_tokens: 200000000
    # Escape hatch for legitimately huge sessions (mega-features at xhigh):
    # label an issue allow-large-session to lift the cap for its sessions.
    max_session_token_override_label: allow-large-session
    # This project's review-flow choice: no human review. Completed issues wait
    # in In Progress for the PR gate (CI green), then promote directly to
    # Merging (gate_wait_state: source). Human Review is never entered unless
    # the optout label is applied or the gate wait times out. This project does
    # not require a GitHub bot PR review signal for promotion; CI and no P1
    # findings are the promotion criteria.
    auto_promote:
        enabled: true
        quiet_seconds: 0
        gate_wait_state: source
        optout_label: requires-human-review
        allowed_issue_labels: []
codex:
    # Allowlist added 2026-08-14: detent#1787 ships elicitation approval
    # DEFAULT EMPTY, so without this block every github connector mutation
    # an agent attempts is declined as "user rejected MCP tool call" and the
    # PR deliverable fails (the Aug 12-14 stranded-branch incidents). Scope is
    # deliberately the workflow's own deliverable on this repo only.
    deliverable_elicitation_allowlist:
      - server: codex_apps
        tool: github.create_pull_request
        repository: digitaldrywood/detent
      - server: codex_apps
        tool: github.update_pull_request
        repository: digitaldrywood/detent
      # Workpad comments and lane-label transitions are ALSO deliverable
      # mutations: the Detent protocol requires them before implementation.
      # Verified 2026-08-14 on gopherguides/corp: every implement session died
      # at workpad creation with "user rejected MCP tool call" on these two
      # tools (40 clean-diff no_progress attempts across corp#343/#473).
      - server: codex_apps
        tool: github.add_comment_to_issue
        repository: digitaldrywood/detent
      - server: codex_apps
        tool: github.update_issue
        repository: digitaldrywood/detent
    # Deliberately unpinned: the Codex CLI default manages the model, so this
    # survives provider model retirements and picks up generation upgrades
    # automatically. Telemetry resolves the effective model from the session
    # since #1103, so pricing attribution works without a pin. Reasoning
    # effort is left at the provider default; not all models accept a
    # model_reasoning_effort override.
    command: codex --config shell_environment_policy.inherit=all app-server
    approval_policy: never
    # Full access: agents run git fetch/worktree against the source repo,
    # need network for `go mod download`, and write to the shared Go build/module
    # cache (~/go, ~/.cache/go-build) which lives outside the worktree.
    thread_sandbox: danger-full-access
    turn_sandbox_policy:
        type: dangerFullAccess
gate:
    kind: command
    run: make check
    require_automated_review: false
budget:
    # Enabled 2026-07-11 as an independent circuit breaker against runaway
    # sessions, orthogonal to the no-progress breaker (which had a real gap,
    # #1224). Notional pricing under subscription auth (Detent's built-in
    # default table, falls back to gpt-5.5 rates for gpt-5.6-sol); still
    # real enough to pace spend and force a cooldown on a burning issue.
    # This project runs the highest volume in the fleet, so the ceilings are
    # higher than gopher-ai's.
    # per_day_max_usd raised 100 -> 250 2026-07-11 PM: the #213/#214 no-PR
    # loop straddled the UTC day boundary, so today's real spend already
    # opened north of $164 before any of it was today's healthy work — the
    # $100 cap was blocking legitimate dispatch on top of yesterday's mess.
    # Revisit back down once #1224/#1229/#1211 land and burn normalizes.
    # per_issue_max_usd raised 8 -> 25 2026-07-11 PM: two separate xhigh-effort
    # structural issues (#1224, #1237) both hit the $8 ceiling doing real,
    # legitimate iterative work with no PR yet to fall back on — the per-issue
    # cap has no automatic reset, so each one stalls permanently at $8 rather
    # than cooling down like the daily cap does. $8 was simply too tight for
    # this project's effort tier, not a fluke either time.
    # per_day_max_usd raised 250 -> 400 2026-07-11 PM: today's real spend
    # reached $278 on genuinely productive work (v0.30.0 shipped, #1224/#1227/
    # #1228/#1229/#1230/#1231 merged, #1233/#1234/#1237/#1239 legitimately
    # in progress, one session each, no loop pattern) — the operator explicitly
    # authorized a heavy, unattended work day. Revisit down tomorrow.
    # DISABLED 2026-07-12 PM (operator decision): this host runs on a flat
    # Codex subscription — every USD in these caps is notional, and a full day
    # of budget refusals (per-issue holds, daily caps consuming FLEET-wide
    # spend per detent#1279) crippled throughput over money that isn't real.
    # Dollar budgets are for metered/API auth; on subscription auth the real
    # constraints are the provider's rolling rate window (capacity pauses,
    # #1158) and outcome-based brakes (no-progress parking #1232,
    # max_session_tokens). Re-enable only behind an auth-aware design.
    enabled: false
    per_day_max_usd: 400
    per_issue_max_usd: 25
    refusal_cooldown_seconds: 3600
hooks:
    after_create: |-
        SOURCE_REPO=$HOME/projects/digitaldrywood/detent
        ISSUE_ID="$(basename "$PWD")"
        BRANCH_NAME="detent/$ISSUE_ID"
        git -C "$SOURCE_REPO" fetch origin main
        git -C "$SOURCE_REPO" worktree prune
        # Prune stale local detent/* branch refs (merged/abandoned issues whose
        # worktree is already gone). git refuses to delete a branch checked out in an
        # active worktree, so in-flight work is protected; the current issue's branch
        # is skipped and (re)created by the worktree add below. GitHub's
        # auto-delete-head-branches only cleans the REMOTE; this keeps the local
        # source clone tidy.
        git -C "$SOURCE_REPO" for-each-ref --format='%(refname:short)' refs/heads/detent/ | while IFS= read -r _b; do
          [ "$_b" = "$BRANCH_NAME" ] && continue
          git -C "$SOURCE_REPO" branch -D "$_b" >/dev/null 2>&1 || true
        done
        # Drop orphaned stash entries left by finished issues. Stashes are
        # repo-global (one refs/stash shared by every worktree) and survive
        # `git worktree remove`, so a stash an agent created and never dropped
        # lingers in the source repo forever. Sweep any stash recorded on a
        # detent/* branch that no longer exists locally; live branches (and
        # therefore in-flight agents' stashes) are untouched, as are stashes on
        # non-detent branches such as main. Iterate from the highest stash index
        # down so drops never shift the indices still to be visited.
        _i="$(git -C "$SOURCE_REPO" stash list 2>/dev/null | wc -l | tr -d ' ')"
        while [ "$_i" -gt 0 ]; do
          _i=$((_i - 1))
          _subj="$(git -C "$SOURCE_REPO" stash list --format='%gs' | sed -n "$((_i + 1))p")"
          _sbranch="${_subj#WIP on }"
          _sbranch="${_sbranch#On }"
          _sbranch="${_sbranch%%:*}"
          case "$_sbranch" in
            (detent/*)
              git -C "$SOURCE_REPO" show-ref --verify --quiet "refs/heads/$_sbranch" ||
                git -C "$SOURCE_REPO" stash drop "stash@{$_i}" >/dev/null 2>&1 || true
              ;;
          esac
        done
        # The Go workspace backend creates the worktree natively (git worktree add)
        # from workspace.source_root before this hook runs, so we no longer add it
        # here. This hook now only keeps origin/main fresh and prunes stale state.

worker:
  # Ambient gh worker auth (v0.66.0, detent#1798): workers resolve gh auth token
  # into their isolated environment. Shared-budget mode by design -- the
  # reserved-headroom brake throttles workers before the orchestrator starves.
  github_token: gh
