apiVersion: detent/v1
kind: GlobalConfig
env: dev
log_level: debug
github_token: gh
port: 4000
global:
    agents:
        # 2026-09-13: fleet default is Codex Astra at low effort -- equivalent in
        # capability to Sol at high, at lower cost. This is the ONLY place the
        # fleet model/effort is set; project detent.yaml files intentionally
        # carry no model_selection block so they inherit this (project layer
        # overrides instance layer, so a project pin silently wins).
        #
        # 2026-09-21 (operator): medium is the absolute automatic ceiling. The
        # effort clamp (detent#2673) caps an issue at its level's effort, and
        # the highest configured level is now medium, so nothing dispatched by
        # policy or requested by an issue can reach high, xhigh, or max --
        # including a `detent-agent` block written by an agent. Going above
        # medium requires a human editing this file. Before this change,
        # very_complex sat at high and 176 Astra sessions ran at high effort
        # (74 at xhigh before 2026-09-08); the clamp stopped the leak, this
        # lowers the ceiling that remained.
        #
        # very_complex stays ABOVE the other levels, at medium, so the
        # complexity:very-complex escalation path still does something rather
        # than collapsing into low.
        model_selection:
            preset: sol_first
            normal_model: gpt-6-astra
            complex_model: gpt-6-astra
            levels:
                normal:
                    effort: low
                complex:
                    effort: low
                very_complex:
                    effort: medium
    # Raised 5 -> 10 (2026-08-08, operator goal: run as many sessions at once as
    # this host can take). THIS is the fleet hard ceiling on concurrent sessions
    # across all projects -- it is a separate pool from each project's
    # agent.max_concurrent_agents and is enforced at dispatch.go:315. Raising a
    # project's value alone cannot exceed it, which is why both moved together.
    #
    # Host headroom at 10 is not a concern: 16 cores / 128 GB, agents measured at
    # ~71 MB RSS each (~0.7 GB for 10), load ~10 and swap unused at 5 running.
    # The real budget is the Codex window, not the machine -- see detent.yaml.
    max_concurrent_agents: 10
    scheduling: strict
    identity:
        name: corys-mac-studio
        ownership_mode: assignee
    fair_share:
        half_life: 1h
    startup:
        jitter_seconds: 0
        max_spawn_per_second: 2
    rate_window_pacing:
        mode: proportional
        floor_percent: 20
        stale_after_seconds: 900
    memory:
        max_agent_rss_bytes: 8589934592
        pressure_some_avg60_threshold: 10
        poll_interval_ms: 1000
projects:
    - id: detent
      workflow: ~/projects/digitaldrywood/detent-orchestration/WORKFLOW.md
      workdir: ~/code/detent-workspaces
      weight: 1
      priority: 0
    - id: gopher-ai
      workflow: /Users/corylanou/projects/gopherguides/gopher-ai/WORKFLOW.md
      workdir: /Users/corylanou/projects/gopherguides/gopher-ai
      weight: 1
      priority: 3
    - id: gopher-corp
      workflow: /Users/corylanou/projects/gopherguides/corp/WORKFLOW.md
      workdir: /Users/corylanou/projects/gopherguides/corp
      weight: 1
      priority: 3
    - id: detent.build
      workflow: /Users/corylanou/projects/digitaldrywood/detent.build/WORKFLOW.md
      workdir: /Users/corylanou/projects/digitaldrywood/detent.build
      weight: 1
      priority: 3
    - id: parable
      workflow: /Users/corylanou/projects/getparable/parable/WORKFLOW.md
      workdir: /Users/corylanou/projects/getparable/parable
      weight: 1
      priority: 3
